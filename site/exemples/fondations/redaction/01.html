<div class="demo-cadre">
  <p class="etiquette">Procédure à l’infinitif — exemple de mise en forme</p>
  <div class="contenu">
    <ol class="bib-procedure">
      <li>Ouvrir le menu <strong>Fichier</strong>.</li>
      <li>Sélectionner <strong>Enregistrer sous</strong>.</li>
      <li>Saisir <code class="bib-saisie">rapport-<var>nom</var>.pdf</code> dans le champ <strong>Nom du fichier</strong>.</li>
      <li>Sélectionner <strong>Enregistrer</strong>.</li>
    </ol>
    <p>Remplacer <var>nom</var> par le nom souhaité. Le fichier est au format PDF.</p>
  </div>
</div>
